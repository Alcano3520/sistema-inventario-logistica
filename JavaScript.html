<script>
  // ==========================================
  // VARIABLES GLOBALES
  // ==========================================
  let usuarioActual = null;
  let productos = [];
  let canvasFirmaEntrada = null;
  let ctxFirmaEntrada = null;
  let canvasFirmaSalida = null;
  let ctxFirmaSalida = null;
  let dibujando = false;

  // ==========================================
  // INICIALIZACIÓN
  // ==========================================
  window.onload = function() {
    // No inicializar el sistema automáticamente
    // El usuario debe hacer login primero
    console.log('Sistema cargado. Esperando autenticación...');
  };

  /**
   * Inicia sesión con usuario y contraseña
   */
  function iniciarSesion() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const mensajeDiv = document.getElementById('mensajeLogin');

    // Validar campos
    if (!email || !password) {
      mostrarMensajeLogin('Por favor complete todos los campos', 'error');
      return;
    }

    // Mostrar cargando
    mensajeDiv.textContent = '🔄 Autenticando...';
    mensajeDiv.className = 'mensaje-login success';
    mensajeDiv.style.display = 'block';

    // Llamar al servidor para autenticar
    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          mostrarMensajeLogin('❌ ' + resultado.error, 'error');
        } else {
          // Login exitoso
          mostrarMensajeLogin('✅ Bienvenido ' + resultado.usuario.nombre, 'success');

          // Esperar 1 segundo y luego cargar el sistema
          setTimeout(function() {
            usuarioActual = resultado.usuario;
            cargarSistemaDespuesDeLogin();
          }, 1000);
        }
      })
      .withFailureHandler(function(error) {
        mostrarMensajeLogin('❌ Error: ' + error.message, 'error');
      })
      .autenticarUsuario(email, password);
  }

  /**
   * Muestra un mensaje en la pantalla de login
   */
  function mostrarMensajeLogin(mensaje, tipo) {
    const mensajeDiv = document.getElementById('mensajeLogin');
    mensajeDiv.textContent = mensaje;
    mensajeDiv.className = 'mensaje-login ' + tipo;
    mensajeDiv.style.display = 'block';
  }

  /**
   * Carga el sistema después de un login exitoso
   */
  function cargarSistemaDespuesDeLogin() {
    // Ocultar pantalla de login
    document.getElementById('pantallaLogin').style.display = 'none';

    // Mostrar pantalla de carga
    document.getElementById('pantallaCarga').style.display = 'flex';

    // Inicializar el sistema completo
    inicializarSistemaCompleto();
  }

  /**
   * Inicializa el sistema completo
   */
  function inicializarSistemaCompleto() {
    // Mostrar información del usuario
    document.getElementById('nombreUsuario').textContent = usuarioActual.nombre;
    document.getElementById('rolUsuario').textContent = usuarioActual.rol;

    // Mostrar tabs de admin si corresponde
    if (usuarioActual.rol === 'Admin') {
      document.getElementById('tabProductos').style.display = 'block';
      document.getElementById('tabCargaMasiva').style.display = 'block';
      document.getElementById('tabMigracion').style.display = 'block';
      document.getElementById('tabUsuarios').style.display = 'block';
      // Mostrar botón de gestión de duplicados en dashboard
      const btnDuplicados = document.getElementById('btnGestionDuplicados');
      if (btnDuplicados) {
        btnDuplicados.style.display = 'inline-block';
      }
    }

    // Inicializar componentes
    inicializarCanvas();
    cargarProductos();
    cargarDashboard();
    inicializarFechas();

    // Pre-cargar historial de entradas (por defecto)
    cargarHistorialEntradas();

    // Ocultar pantalla de carga y mostrar contenido
    document.getElementById('pantallaCarga').style.display = 'none';
    document.getElementById('contenidoPrincipal').style.display = 'block';

    // Agregar primer item por defecto en formularios
    agregarItemEntrada();
    agregarItemSalida();

    // Cargar información del perfil
    cargarMiPerfil();
  }

  /**
   * Cierra la sesión actual
   */
  function cerrarSesion() {
    if (confirm('¿Está seguro de cerrar sesión?')) {
      google.script.run
        .withSuccessHandler(function(resultado) {
          // Recargar la página para volver al login
          location.reload();
        })
        .withFailureHandler(function(error) {
          alert('Error al cerrar sesión: ' + error.message);
        })
        .cerrarSesion();
    }
  }

  /**
   * Carga la información del perfil del usuario
   */
  function cargarMiPerfil() {
    document.getElementById('perfilEmail').textContent = usuarioActual.email;
    document.getElementById('perfilNombre').textContent = usuarioActual.nombre;
    document.getElementById('perfilRol').textContent = usuarioActual.rol;
  }

  /**
   * Cambia la contraseña del usuario actual
   */
  function cambiarMiPassword() {
    const passwordActual = document.getElementById('passwordActual').value;
    const passwordNueva = document.getElementById('passwordNueva').value;
    const passwordConfirmar = document.getElementById('passwordConfirmar').value;

    // Validaciones
    if (!passwordActual || !passwordNueva || !passwordConfirmar) {
      mostrarError('Debe completar todos los campos');
      return;
    }

    if (passwordNueva !== passwordConfirmar) {
      mostrarError('Las contraseñas nuevas no coinciden');
      return;
    }

    if (passwordNueva.length < 6) {
      mostrarError('La nueva contraseña debe tener al menos 6 caracteres');
      return;
    }

    mostrarCargando('Cambiando contraseña...');

    google.script.run
      .withSuccessHandler(function(resultado) {
        ocultarCargando();

        if (resultado.error) {
          mostrarError(resultado.error);
        } else {
          mostrarExito('✅ Contraseña cambiada exitosamente');

          // Limpiar campos
          document.getElementById('passwordActual').value = '';
          document.getElementById('passwordNueva').value = '';
          document.getElementById('passwordConfirmar').value = '';
        }
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        mostrarError(error.message);
      })
      .cambiarPassword(usuarioActual.email, passwordActual, passwordNueva);
  }

  /**
   * Inicializa los canvas de firma
   */
  function inicializarCanvas() {
    // Canvas de entrada
    canvasFirmaEntrada = document.getElementById('firmaEntrada');
    ctxFirmaEntrada = canvasFirmaEntrada.getContext('2d');
    configurarCanvas(canvasFirmaEntrada, ctxFirmaEntrada);

    // Canvas de salida
    canvasFirmaSalida = document.getElementById('firmaSalida');
    ctxFirmaSalida = canvasFirmaSalida.getContext('2d');
    configurarCanvas(canvasFirmaSalida, ctxFirmaSalida);
  }

  /**
   * Inicializa los campos de fecha con la fecha actual
   */
  function inicializarFechas() {
    const hoy = new Date().toISOString().split('T')[0];
    const entradaFecha = document.getElementById('entradaFecha');
    const salidaFecha = document.getElementById('salidaFecha');

    if (entradaFecha) entradaFecha.value = hoy;
    if (salidaFecha) salidaFecha.value = hoy;
  }

  /**
   * Configura un canvas de firma
   */
  function configurarCanvas(canvas, ctx) {
    // Ajustar tamaño
    canvas.width = 350;
    canvas.height = 150;

    // Configurar estilo de dibujo
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    // Eventos de mouse
    canvas.addEventListener('mousedown', function(e) {
      dibujando = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('mousemove', function(e) {
      if (!dibujando) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    });

    canvas.addEventListener('mouseup', function() {
      dibujando = false;
    });

    canvas.addEventListener('mouseout', function() {
      dibujando = false;
    });

    // Eventos táctiles (para dispositivos móviles)
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      dibujando = true;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      ctx.beginPath();
      ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (!dibujando) return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
      ctx.stroke();
    });

    canvas.addEventListener('touchend', function() {
      dibujando = false;
    });
  }

  /**
   * Limpia un canvas de firma
   */
  function limpiarFirma(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  /**
   * Convierte un canvas a imagen base64
   */
  function obtenerFirmaBase64(canvas) {
    return canvas.toDataURL();
  }

  // ==========================================
  // NAVEGACIÓN
  // ==========================================

  /**
   * Muestra una sección específica
   */
  function mostrarSeccion(nombreSeccion) {
    // Ocultar todas las secciones
    const secciones = document.querySelectorAll('.seccion');
    secciones.forEach(s => s.classList.remove('active'));

    // Mostrar sección seleccionada
    document.getElementById('seccion' + capitalizar(nombreSeccion)).classList.add('active');

    // Actualizar tabs activos
    const tabs = document.querySelectorAll('.tab-button');
    tabs.forEach(t => t.classList.remove('active'));

    // Buscar el tab correspondiente por ID
    const tabId = 'tab' + capitalizar(nombreSeccion);
    const tabElement = document.getElementById(tabId);
    if (tabElement) {
      tabElement.classList.add('active');
    }

    // Cargar datos según la sección
    switch(nombreSeccion) {
      case 'dashboard':
        cargarDashboard();
        break;
      case 'inventario':
        cargarInventario();
        break;
      case 'historial':
        cargarHistorialEntradas();
        break;
      case 'usuarios':
        cargarUsuarios();
        break;
    }
  }

  /**
   * Muestra un tipo de historial específico
   */
  function mostrarHistorial(tipo) {
    // Actualizar tabs secundarios manualmente sin usar event.target
    const tabs = document.querySelectorAll('.tab-button-sec');
    tabs.forEach(t => t.classList.remove('active'));

    // Activar el tab correcto por posición
    if (tipo === 'entradas') {
      tabs[0].classList.add('active'); // Primer tab (Entradas)
      document.getElementById('historialEntradas').style.display = 'block';
      document.getElementById('historialSalidas').style.display = 'none';
      cargarHistorialEntradas();
    } else {
      tabs[1].classList.add('active'); // Segundo tab (Salidas)
      document.getElementById('historialEntradas').style.display = 'none';
      document.getElementById('historialSalidas').style.display = 'block';
      cargarHistorialSalidas();
    }
  }

  // ==========================================
  // DASHBOARD
  // ==========================================

  /**
   * Carga el dashboard con estadísticas
   */
  function cargarDashboard() {
    google.script.run
      .withSuccessHandler(function(stats) {
        document.getElementById('totalProductos').textContent = stats.totalProductos;
        document.getElementById('productosConStock').textContent = stats.productosConStock;
        document.getElementById('productosSinStock').textContent = stats.productosSinStock;
        document.getElementById('productosStockBajo').textContent = stats.productosStockBajo;

        // Mostrar alertas de stock bajo
        if (stats.productosStockBajo > 0) {
          cargarProductosStockBajo();
        } else {
          document.getElementById('alertasStockBajo').style.display = 'none';
        }
      })
      .withFailureHandler(mostrarError)
      .obtenerEstadisticas();
  }

  /**
   * Carga productos con stock bajo
   */
  function cargarProductosStockBajo() {
    google.script.run
      .withSuccessHandler(function(productos) {
        // Validación defensiva
        if (!productos || !Array.isArray(productos) || productos.length === 0) {
          document.getElementById('alertasStockBajo').style.display = 'none';
          return;
        }

        const lista = document.getElementById('listaStockBajo');
        lista.innerHTML = '';

        productos.forEach(p => {
          const li = document.createElement('li');
          li.textContent = `${p.cod} - ${p.producto} (Stock: ${p.stock} / Mínimo: ${p.stockMinimo})`;
          lista.appendChild(li);
        });

        document.getElementById('alertasStockBajo').style.display = 'block';
      })
      .withFailureHandler(mostrarError)
      .obtenerProductosStockBajo();
  }

  /**
   * Ejecuta diagnóstico del sistema
   */
  function ejecutarDiagnostico() {
    const container = document.getElementById('resultadoDiagnostico');
    container.innerHTML = '<p class="text-center">🔍 Ejecutando diagnóstico...</p>';

    google.script.run
      .withSuccessHandler(function(diagnostico) {
        let html = '<div class="alerta info"><strong>📋 Diagnóstico del Sistema:</strong><br><br>';

        // Mostrar información de hojas
        html += '<strong>Estado de las Hojas:</strong><ul>';
        Object.keys(diagnostico.hojas).forEach(key => {
          const hoja = diagnostico.hojas[key];
          if (hoja.existe) {
            html += `<li>✅ ${hoja.nombre}: ${hoja.datos} registros</li>`;
          } else {
            html += `<li>❌ ${hoja.nombre}: NO EXISTE</li>`;
          }
        });
        html += '</ul>';

        // Mostrar transacciones
        html += '<strong>Transacciones Registradas:</strong><ul>';
        html += `<li>📥 Entradas totales: ${diagnostico.transacciones.entradas}</li>`;
        html += `<li>📥 Entradas migradas: ${diagnostico.transacciones.entradasMigradas}</li>`;
        html += `<li>📤 Salidas totales: ${diagnostico.transacciones.salidas}</li>`;
        html += `<li>📤 Salidas migradas: ${diagnostico.transacciones.salidasMigradas}</li>`;
        html += '</ul>';

        // Verificar problemas
        if (diagnostico.transacciones.entradas === 0 && diagnostico.transacciones.salidas === 0) {
          html += '<br><div class="alerta warning"><strong>⚠️ No hay transacciones registradas.</strong><br>';
          html += 'Las migraciones que realizaste no se guardaron. Posibles causas:<br>';
          html += '1. No actualizaste el archivo Code_v2_seguro.gs en Google Apps Script<br>';
          html += '2. Las hojas necesarias no existen<br>';
          html += '3. Hubo un error durante la migración que no se mostró</div>';
        }

        html += '</div>';
        container.innerHTML = html;
      })
      .withFailureHandler(function(error) {
        container.innerHTML = `<div class="alerta error"><strong>❌ Error en diagnóstico:</strong><br>${error.message}</div>`;
      })
      .diagnosticoSistema();
  }

  // ==========================================
  // PRODUCTOS
  // ==========================================

  /**
   * Carga todos los productos
   */
  function cargarProductos() {
    google.script.run
      .withSuccessHandler(function(data) {
        // Validación defensiva
        productos = (data && Array.isArray(data)) ? data : [];
      })
      .withFailureHandler(mostrarError)
      .obtenerProductos();
  }

  /**
   * Carga el inventario
   */
  function cargarInventario() {
    const tbody = document.getElementById('tablaInventario');
    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Cargando...</td></tr>';

    google.script.run
      .withSuccessHandler(function(data) {
        // Validación defensiva
        productos = (data && Array.isArray(data)) ? data : [];
        mostrarInventario(productos);
      })
      .withFailureHandler(mostrarError)
      .obtenerProductos();
  }

  /**
   * Muestra el inventario en la tabla
   */
  function mostrarInventario(data) {
    const tbody = document.getElementById('tablaInventario');
    tbody.innerHTML = '';

    // Validación defensiva
    if (!data || !Array.isArray(data) || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay productos registrados</td></tr>';
      return;
    }

    data.forEach(p => {
      const tr = document.createElement('tr');

      // Aplicar clase según stock
      if (p.stock === 0) {
        tr.classList.add('stock-cero');
      } else if (p.stockMinimo > 0 && p.stock <= p.stockMinimo) {
        tr.classList.add('stock-bajo');
      }

      tr.innerHTML = `
        <td>${p.cod}</td>
        <td>${p.producto}</td>
        <td>${p.entrada}</td>
        <td>${p.salida}</td>
        <td><strong>${p.stock}</strong></td>
        <td>${p.categoria || '-'}</td>
        <td>${p.ubicacion || '-'}</td>
        <td>${p.stockMinimo || '-'}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  /**
   * Búsqueda en inventario
   */
  document.addEventListener('DOMContentLoaded', function() {
    const buscadorInventario = document.getElementById('buscarInventario');
    if (buscadorInventario) {
      buscadorInventario.addEventListener('input', function() {
        const termino = this.value.toLowerCase();
        const productosFiltrados = productos.filter(p =>
          p.cod.toString().toLowerCase().includes(termino) ||
          p.producto.toLowerCase().includes(termino)
        );
        mostrarInventario(productosFiltrados);
      });
    }

    // Si existe el campo de login, agregar listener de Enter
    const loginPassword = document.getElementById('loginPassword');
    if (loginPassword) {
      loginPassword.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          iniciarSesion();
        }
      });
    }

    const loginEmail = document.getElementById('loginEmail');
    if (loginEmail) {
      loginEmail.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          document.getElementById('loginPassword').focus();
        }
      });
    }
  });

  // ==========================================
  // ENTRADA DE PRODUCTOS
  // ==========================================

  let contadorItemsEntrada = 0;

  /**
   * Agrega una línea de ítem para entrada
   */
  function agregarItemEntrada() {
    contadorItemsEntrada++;
    const container = document.getElementById('itemsEntrada');

    const itemDiv = document.createElement('div');
    itemDiv.className = 'item-row';
    itemDiv.id = 'itemEntrada' + contadorItemsEntrada;

    itemDiv.innerHTML = `
      <div class="form-group">
        <label>Producto:</label>
        <div class="autocomplete-container">
          <input type="text"
                 class="form-control entrada-producto"
                 id="entradaProducto${contadorItemsEntrada}"
                 oninput="mostrarDropdownProductos(${contadorItemsEntrada}, 'entrada')"
                 onfocus="mostrarDropdownProductos(${contadorItemsEntrada}, 'entrada')"
                 placeholder="Buscar producto..."
                 autocomplete="off">
          <div class="autocomplete-dropdown" id="dropdownEntrada${contadorItemsEntrada}"></div>
        </div>
      </div>
      <div class="form-group">
        <label>Código:</label>
        <input type="text"
               class="form-control entrada-cod"
               id="entradaCod${contadorItemsEntrada}"
               readonly
               placeholder="Código">
      </div>
      <div class="form-group">
        <label>Cantidad:</label>
        <input type="number"
               class="form-control entrada-cantidad"
               min="0"
               step="1"
               placeholder="0">
      </div>
      <button type="button" class="btn-remove" onclick="eliminarItemEntrada(${contadorItemsEntrada})">
        🗑️
      </button>
    `;

    container.appendChild(itemDiv);
  }

  /**
   * Muestra dropdown de productos con autocompletado
   */
  function mostrarDropdownProductos(id, tipo) {
    const inputProducto = document.getElementById(tipo + 'Producto' + id);
    const dropdown = document.getElementById('dropdown' + capitalizar(tipo) + id);
    const termino = inputProducto.value.toLowerCase().trim();

    // Limpiar dropdown
    dropdown.innerHTML = '';

    if (termino.length === 0) {
      dropdown.classList.remove('active');
      return;
    }

    // Filtrar productos
    const productosFiltrados = productos.filter(p =>
      p.producto.toLowerCase().includes(termino) ||
      p.cod.toString().toLowerCase().includes(termino)
    );

    if (productosFiltrados.length === 0) {
      dropdown.innerHTML = '<div class="autocomplete-no-results">No se encontraron productos</div>';
      dropdown.classList.add('active');
      return;
    }

    // Mostrar resultados (máximo 10)
    productosFiltrados.slice(0, 10).forEach(producto => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.innerHTML = `
        <div class="autocomplete-item-cod">${producto.cod}</div>
        <div class="autocomplete-item-nombre">${producto.producto}</div>
      `;

      item.onclick = function() {
        seleccionarProducto(id, tipo, producto);
      };

      dropdown.appendChild(item);
    });

    dropdown.classList.add('active');
  }

  /**
   * Selecciona un producto del dropdown
   */
  function seleccionarProducto(id, tipo, producto) {
    const inputProducto = document.getElementById(tipo + 'Producto' + id);
    const inputCod = document.getElementById(tipo + 'Cod' + id);
    const dropdown = document.getElementById('dropdown' + capitalizar(tipo) + id);

    // Llenar campos
    inputProducto.value = producto.producto;
    inputCod.value = producto.cod;

    // Cerrar dropdown
    dropdown.classList.remove('active');
    dropdown.innerHTML = '';
  }

  /**
   * Elimina un ítem de entrada
   */
  function eliminarItemEntrada(id) {
    const item = document.getElementById('itemEntrada' + id);
    if (item) {
      item.remove();
    }
  }

  /**
   * Guarda una entrada
   */
  function guardarEntrada() {
    // Recopilar datos del formulario
    const fecha = document.getElementById('entradaFecha').value;
    const proveedor = document.getElementById('entradaProveedor').value;
    const numFactura = document.getElementById('entradaNumFactura').value;
    const observaciones = document.getElementById('entradaObservaciones').value;
    const firma = obtenerFirmaBase64(canvasFirmaEntrada);

    // Recopilar items
    const items = [];
    const itemsDiv = document.querySelectorAll('#itemsEntrada .item-row');

    itemsDiv.forEach(itemDiv => {
      const cod = itemDiv.querySelector('.entrada-cod').value;
      const cantidad = parseFloat(itemDiv.querySelector('.entrada-cantidad').value);

      if (cod && cantidad > 0) {
        items.push({ cod, cantidad });
      }
    });

    // Validar
    if (items.length === 0) {
      mostrarError('Debe agregar al menos un producto con cantidad mayor a 0');
      return;
    }

    // Enviar al servidor
    const datos = {
      fecha,
      proveedor,
      numFactura,
      observaciones,
      firma,
      items
    };

    mostrarCargando('Guardando entrada...');

    google.script.run
      .withSuccessHandler(function(resultado) {
        ocultarCargando();
        if (resultado.error) {
          mostrarError(resultado.error);
        } else {
          mostrarExito('✅ Entrada registrada exitosamente. ID: ' + resultado.idTransaccion);
          limpiarFormularioEntrada();
          cargarProductos();
          cargarDashboard();
        }
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        mostrarError(error.message);
      })
      .registrarEntrada(datos);
  }

  /**
   * Limpia el formulario de entrada
   */
  function limpiarFormularioEntrada() {
    document.getElementById('entradaFecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('entradaProveedor').value = '';
    document.getElementById('entradaNumFactura').value = '';
    document.getElementById('entradaObservaciones').value = '';
    document.getElementById('itemsEntrada').innerHTML = '';

  /**
   * Guarda una salida
   */
  function guardarSalida() {
    // Recopilar datos del formulario
    const fecha = document.getElementById('salidaFecha').value;
    const aQuienEntrega = document.getElementById('salidaAQuienEntrega').value;
    const bote = document.getElementById('salidaBote').value;
    const proposito = document.getElementById('salidaProposito').value;
    const firma = obtenerFirmaBase64(canvasFirmaSalida);

    // Validar
    if (!aQuienEntrega) {
      mostrarError('Debe especificar a quién se entrega');
      return;
    }

    if (!bote) {
      mostrarError('Debe especificar el bote');
      return;
    }

    // Recopilar items
    const items = [];
    const itemsDiv = document.querySelectorAll('#itemsSalida .item-row');

    itemsDiv.forEach(itemDiv => {
      const cod = itemDiv.querySelector('.salida-cod').value;
      const cantidad = parseFloat(itemDiv.querySelector('.salida-cantidad').value);

      if (cod && cantidad > 0) {
        items.push({ cod, cantidad });
      }
    });

    // Validar items
    if (items.length === 0) {
      mostrarError('Debe agregar al menos un producto con cantidad mayor a 0');
      return;
    }

    // Enviar al servidor
    const datos = {
      fecha,
      aQuienEntrega,
      bote,
      proposito,
      firma,
      items
    };

    mostrarCargando('Guardando salida...');

    google.script.run
      .withSuccessHandler(function(resultado) {
        ocultarCargando();
        if (resultado.error) {
          mostrarError(resultado.error);
        } else {
          mostrarExito('✅ Salida registrada exitosamente. ID: ' + resultado.idTransaccion);
          limpiarFormularioSalida();
          cargarProductos();
          cargarDashboard();
        }
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        mostrarError(error.message);
      })
      .registrarSalida(datos);
  }

    const datosArray = [];

    lineas.forEach(linea => {

      if (campos.length >= 2) {

      }
    });

    if (datosArray.length === 0) {

      return;

    mostrarCargando(`⏳ Cargando ${datosArray.length} productos...\nPor favor espere...`);

        mostrarCargando('✅ Carga completada!\nActualizando interfaz...');

        let mensaje = `
          <div class="alerta success">
            <strong>✅ Carga masiva completada:</strong><br>
            - Productos agregados: ${resultado.agregados}<br>
            - Productos actualizados: ${resultado.actualizados}

        if (resultado.errores.length > 0) {
          mensaje += `<br><br><strong>⚠️ Errores:</strong><ul>`;
          resultado.errores.forEach(error => {
            mensaje += `<li>${error}</li>`;
          });
          mensaje += `</ul>`;
        }

        mensaje += `</div>`;

        document.getElementById('resultadoCargaMasiva').innerHTML = mensaje;

        mostrarError(error.message);

  /**
   * Procesa la carga de entradas históricas
   */
  function procesarCargaEntradasHistoricas() {
    const textarea = document.getElementById('datosEntradasHistoricas');
    const datos = textarea.value.trim();
    const resultadoDiv = document.getElementById('resultadoCargaEntradas');

    if (!datos) {
      mostrarError('Debe ingresar datos para cargar');
      return;
    }

    // VALIDACIÓN PREVIA: Parsear y validar CSV antes de enviar
    const lineas = datos.split('\n').filter(l => l.trim()); // Filtrar líneas vacías
    const datosArray = [];
    const erroresPrevalidacion = [];
    let lineasSaltadasPrev = 0;

    lineas.forEach((linea, index) => {
      const numLinea = index + 1;
      const campos = linea.split(',').map(c => c.trim());

      // Validar número de campos
      if (campos.length < 4) {
        erroresPrevalidacion.push(`Línea ${numLinea}: Solo tiene ${campos.length} campos, necesita 4 (COD, PRODUCTO, FECHA, CANTIDAD). Datos: "${linea.substring(0, 50)}..."`);
        lineasSaltadasPrev++;
        return;
      }

      const cod = campos[0];
      const producto = campos[1];
      const fecha = campos[2];
      const cantidad = campos[3];

      // Validar campos individuales
      if (!cod) {
        erroresPrevalidacion.push(`Línea ${numLinea}: Código vacío`);
        lineasSaltadasPrev++;
        return;
      }
      if (!producto) {
        erroresPrevalidacion.push(`Línea ${numLinea}: Nombre de producto vacío (código: ${cod})`);
        lineasSaltadasPrev++;
        return;
      }
      if (!fecha) {
        erroresPrevalidacion.push(`Línea ${numLinea}: Fecha vacía (código: ${cod})`);
        lineasSaltadasPrev++;
        return;
      }
      if (!cantidad || isNaN(parseFloat(cantidad)) || parseFloat(cantidad) <= 0) {
        erroresPrevalidacion.push(`Línea ${numLinea}: Cantidad inválida "${cantidad}" (código: ${cod})`);
        lineasSaltadasPrev++;
        return;
      }

      // Si pasó todas las validaciones, agregar
      datosArray.push(campos);
    });

    // Mostrar resumen de prevalidación
    let mensajePreval = `<div class="alerta info">
      <strong>📋 Prevalidación del CSV:</strong><br>
      - Total líneas en el archivo: ${lineas.length}<br>
      - Líneas válidas para procesar: ${datosArray.length}<br>
      - Líneas con problemas: ${lineasSaltadasPrev}
    `;

    if (erroresPrevalidacion.length > 0) {
      mensajePreval += `<br><br><strong>⚠️ Problemas detectados (${erroresPrevalidacion.length}):</strong><ul style="max-height: 200px; overflow-y: auto;">`;
      erroresPrevalidacion.forEach(error => {
        mensajePreval += `<li style="font-size: 11px;">${error}</li>`;
      });
      mensajePreval += `</ul>`;
    }
    mensajePreval += `</div>`;

    if (datosArray.length === 0) {
      resultadoDiv.innerHTML = mensajePreval + `<div class="alerta error"><strong>❌ No hay datos válidos para procesar.</strong><br>Revise el formato: COD, PRODUCTO, FECHA, CANTIDAD</div>`;
      return;
    }

    // Mostrar prevalidación y preguntar
    resultadoDiv.innerHTML = mensajePreval;

    if (!confirm(`Se encontraron ${datosArray.length} líneas válidas de ${lineas.length} totales.\n\n${lineasSaltadasPrev > 0 ? `⚠️ ${lineasSaltadasPrev} líneas tienen problemas y serán saltadas.\n\n` : ''}¿Desea continuar con la carga?`)) {
      return;
    }

    mostrarCargando(`⏳ Procesando ${datosArray.length} entradas...\nPor favor espere, esto puede tomar varios minutos...`);

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          ocultarCargando();
          let errorMsg = `<div class="alerta error"><strong>❌ Error:</strong> ${resultado.error}`;
          if (resultado.stack) {
            errorMsg += `<br><small>Detalle técnico: ${resultado.stack}</small>`;
          }
          errorMsg += `</div>`;
          resultadoDiv.innerHTML = mensajePreval + errorMsg;
          return;
        }

        // Actualizar mensaje de carga
        mostrarCargando('✅ Entradas registradas!\nActualizando inventario...');

        let mensaje = `
          <div class="alerta success">
            <strong>✅ Carga de entradas completada:</strong><br>
            <table style="width:100%; margin-top:10px;">
              <tr><td>📊 Total filas recibidas:</td><td><strong>${resultado.totalFilasRecibidas || datosArray.length}</strong></td></tr>
              <tr><td>✅ Items procesados:</td><td><strong>${resultado.procesados}</strong></td></tr>
              <tr><td>📦 Transacciones creadas:</td><td><strong>${resultado.transaccionesCreadas}</strong></td></tr>
              <tr><td>🆕 Productos nuevos creados:</td><td><strong>${resultado.productosCreados || 0}</strong></td></tr>
              <tr><td>⏭️ Items saltados:</td><td><strong>${resultado.saltados}</strong></td></tr>
            </table>
        `;

        if (resultado.resumen) {
          mensaje += `<br><em>${resultado.resumen}</em>`;
        }

        if (resultado.errores && resultado.errores.length > 0) {
          mensaje += `<br><br><strong>⚠️ Errores durante el proceso (${resultado.errores.length}):</strong>
          <ul style="max-height: 150px; overflow-y: auto; font-size: 11px;">`;
          resultado.errores.slice(0, 20).forEach(error => {
            mensaje += `<li>${error}</li>`;
          });
          if (resultado.errores.length > 20) {
            mensaje += `<li><strong>... y ${resultado.errores.length - 20} errores más</strong></li>`;
          }
          mensaje += `</ul>`;
        }

        mensaje += `</div>`;

        resultadoDiv.innerHTML = mensajePreval + mensaje;

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        // Esperar un momento antes de ocultar
        setTimeout(function() {
          ocultarCargando();
        }, 1500);
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        resultadoDiv.innerHTML = mensajePreval + `<div class="alerta error"><strong>❌ Error de conexión:</strong> ${error.message}</div>`;
      })
      .migrarEntradasHistoricas(datosArray);
  }

  /**

    mostrarCargando(`⏳ Procesando ${datosArray.length} salidas...\nPor favor espere, esto puede tomar varios minutos...`);

      .withSuccessHandler(function(resultado) {

        // Actualizar mensaje de carga

          mensaje += `<br><br><strong>⚠️ Errores (${resultado.errores.length}):</strong><ul>`;
          resultado.errores.slice(0, 10).forEach(error => {

          if (resultado.errores.length > 10) {
            mensaje += `<li>... y ${resultado.errores.length - 10} errores más</li>`;
          }
          mensaje += `</ul>`;
        }

        mensaje += `</div>`;

        document.getElementById('resultadoCargaSalidas').innerHTML = mensaje;

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        // Esperar un momento antes de ocultar
        setTimeout(function() {
          ocultarCargando();
        }, 1500);
      })

  function exportarInventarioExcel() {

  /**
   * Convierte un array 2D a CSV
   */
  function arrayToCSV(data) {
    return data.map(row =>
      row.map(cell => {
        const cellStr = String(cell);
        // Escapar comillas y envolver en comillas si contiene coma, comilla o salto de línea
        if (cellStr.includes(',') || cellStr.includes('"') || cellStr.includes('\n')) {
          return '"' + cellStr.replace(/"/g, '""') + '"';
        }
        return cellStr;
      }).join(',')
    ).join('\n');
  }

  /**
   * Descarga un archivo
   */
  function descargarArchivo(contenido, nombreArchivo, tipoMIME) {
    const blob = new Blob(['\uFEFF' + contenido], { type: tipoMIME });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
  }

  /**
   * Muestra dropdown para filtro de productos
   */
  function mostrarDropdownFiltro() {
    const input = document.getElementById('buscarProductoFiltro');
    const dropdown = document.getElementById('dropdownFiltro');
    const termino = input.value.toLowerCase().trim();

    dropdown.innerHTML = '';

    if (termino.length === 0) {
      dropdown.classList.remove('active');
      return;
    }

    // Filtrar productos que no estén ya seleccionados
    const productosDisponibles = productos.filter(p =>
      !productosFiltroSeleccionados.find(ps => ps.cod === p.cod) &&
      (p.producto.toLowerCase().includes(termino) || p.cod.toString().toLowerCase().includes(termino))
    );

    if (productosDisponibles.length === 0) {
      dropdown.innerHTML = '<div class="autocomplete-no-results">No se encontraron productos</div>';
      dropdown.classList.add('active');
      return;
    }

    productosDisponibles.slice(0, 10).forEach(producto => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.innerHTML = `
        <div class="autocomplete-item-cod">${producto.cod}</div>
        <div class="autocomplete-item-nombre">${producto.producto}</div>
      `;

      item.onclick = function() {
        agregarProductoAFiltro(producto);
      };

      dropdown.appendChild(item);
    });

    dropdown.classList.add('active');
  }

  /**
   * Agrega un producto al filtro
   */
  function agregarProductoAFiltro(producto) {
    if (!productosFiltroSeleccionados.find(p => p.cod === producto.cod)) {
      productosFiltroSeleccionados.push(producto);
      actualizarListaProductosFiltrados();
    }

    document.getElementById('buscarProductoFiltro').value = '';
    document.getElementById('dropdownFiltro').classList.remove('active');
  }

    productosFiltroSeleccionados = productosFiltroSeleccionados.filter(p => p.cod !== cod);
    actualizarListaProductosFiltrados();

    const tabs = document.querySelectorAll('.tab-button-sec');

    event.target.classList.add('active');

  /**
   * Procesa la migración de entradas
   */
  function procesarMigracionEntradas() {
    const textarea = document.getElementById('datosEntradas');
    const datos = textarea.value.trim();

    if (!datos) {
      mostrarError('Debe ingresar datos para migrar');
      return;
    }

    if (!confirm('¿Está seguro de migrar estas entradas? Esta acción creará transacciones históricas y actualizará los stocks.')) {
      return;
    }

    // Parsear CSV
    const lineas = datos.split('\n');
    const datosArray = [];

    lineas.forEach(linea => {
      const campos = linea.split(',').map(c => c.trim());
      if (campos.length >= 4 && campos[0] && campos[2] && campos[3]) {
        datosArray.push(campos);
      }
    });

    if (datosArray.length === 0) {
      mostrarError('No se encontraron datos válidos');
      return;
    }

    mostrarCargando(`⏳ Migrando ${datosArray.length} entradas históricas...\nEsto puede tomar varios minutos...\nNO CIERRE ESTA VENTANA`);

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          ocultarCargando();
          mostrarError(resultado.error);
          return;
        }

        // Actualizar mensaje
        mostrarCargando('✅ Migración completada!\nActualizando sistema...');

        let mensaje = `
          <div class="alerta success">
            <strong>✅ Migración de entradas completada:</strong><br>
            - Items procesados: ${resultado.procesados}<br>
            - Transacciones creadas: ${resultado.transaccionesCreadas}<br>
            - Items saltados: ${resultado.saltados}
        `;

        if (resultado.errores.length > 0) {
          mensaje += `<br><br><strong>⚠️ Errores (${resultado.errores.length}):</strong><ul>`;
          resultado.errores.slice(0, 10).forEach(error => {

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        // Esperar antes de ocultar
        setTimeout(function() {
          ocultarCargando();
        }, 1500);
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        mostrarError(error.message);
      })
      .migrarEntradasHistoricas(datosArray);
  }

  /**
   * Procesa la migración de salidas
   */
  function procesarMigracionSalidas() {
    const textarea = document.getElementById('datosSalidas');
    const datos = textarea.value.trim();

    if (!datos) {
      mostrarError('Debe ingresar datos para migrar');
      return;
    }

    if (!confirm('¿Está seguro de migrar estas salidas? Esta acción creará transacciones históricas y actualizará los stocks.')) {
      return;
    }

    // Parsear CSV
    const lineas = datos.split('\n');
    const datosArray = [];

    lineas.forEach(linea => {
      const campos = linea.split(',').map(c => c.trim());
      if (campos.length >= 4 && campos[0] && campos[2] && campos[3]) {
        datosArray.push(campos);
      }
    });

    if (datosArray.length === 0) {
      mostrarError('No se encontraron datos válidos');
      return;
    }

    mostrarCargando(`⏳ Migrando ${datosArray.length} salidas históricas...\nEsto puede tomar varios minutos...\nNO CIERRE ESTA VENTANA`);

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          ocultarCargando();
          mostrarError(resultado.error);
          return;
        }

        // Actualizar mensaje
        mostrarCargando('✅ Migración completada!\nActualizando sistema...');

        let mensaje = `
          <div class="alerta success">
            <strong>✅ Migración de salidas completada:</strong><br>
            - Items procesados: ${resultado.procesados}<br>
            - Transacciones creadas: ${resultado.transaccionesCreadas}<br>
            - Items saltados: ${resultado.saltados}
        `;

        if (resultado.errores.length > 0) {
          mensaje += `<br><br><strong>⚠️ Errores (${resultado.errores.length}):</strong><ul>`;
          resultado.errores.slice(0, 10).forEach(error => {
            mensaje += `<li>${error}</li>`;
          });
          if (resultado.errores.length > 10) {
            mensaje += `<li>... y ${resultado.errores.length - 10} errores más</li>`;
          }
          mensaje += `</ul>`;
        }

        mensaje += `</div>`;

        document.getElementById('resultadoMigracionSalidas').innerHTML = mensaje;

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        // Esperar antes de ocultar
        setTimeout(function() {
          ocultarCargando();
        }, 1500);
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        mostrarError(error.message);
      })
      .migrarSalidasHistoricas(datosArray);
  }

  /**
   * Limpia el formulario de migración de entradas
   */
  function limpiarMigracionEntradas() {
    document.getElementById('datosEntradas').value = '';
    document.getElementById('resultadoMigracionEntradas').innerHTML = '';
  }

  /**
   * Limpia el formulario de migración de salidas
   */
  function limpiarMigracionSalidas() {
    document.getElementById('datosSalidas').value = '';
    document.getElementById('resultadoMigracionSalidas').innerHTML = '';
  }

  // ==========================================
  // GESTIÓN DE DUPLICADOS
  // ==========================================

  /**
   * Detecta y muestra duplicados en pantalla
   */
  function detectarYMostrarDuplicados() {
    const container = document.getElementById('resultadoDeteccionDuplicados');
    container.innerHTML = '<p class="text-center">🔍 Detectando duplicados...</p>';

    mostrarCargando('🔍 Detectando duplicados...\nPor favor espere...');

    google.script.run
      .withSuccessHandler(function(resultado) {
        ocultarCargando();

        // Validación: verificar si resultado es null o undefined
        if (!resultado) {
          container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> El servidor no devolvió ningún resultado. Verifique que la función detectarDuplicados() exista en Code_v2_seguro.gs</div>`;
          return;
        }

        if (resultado.error) {
          container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${resultado.error}</div>`;
          return;
        }

        let html = '<div class="alerta info">';
        html += '<h4>📊 Resultado de la Detección</h4>';
        html += `<p><strong>Entradas duplicadas encontradas:</strong> ${resultado.totalEntradasDuplicadas} transacciones</p>`;
        html += `<p><strong>Salidas duplicadas encontradas:</strong> ${resultado.totalSalidasDuplicadas} transacciones</p>`;

        // MOSTRAR SOLO RESUMEN - No listar todo para evitar congelamiento
        if (resultado.entradasDuplicadas.length > 0) {
          html += '<br><h5>📥 Resumen de Entradas Duplicadas:</h5>';
          html += `<p><strong>Total de grupos duplicados:</strong> ${resultado.entradasDuplicadas.length}</p>`;

          // Mostrar solo los primeros 5 grupos como ejemplo
          html += '<p><strong>Primeros grupos (muestra máximo 5):</strong></p><ul>';
          const maxGrupos = Math.min(5, resultado.entradasDuplicadas.length);

          for (let i = 0; i < maxGrupos; i++) {
            const grupo = resultado.entradasDuplicadas[i];
            html += `<li><strong>Grupo ${i + 1}:</strong> ${grupo.cantidad} transacciones duplicadas<br>`;
            html += `Proveedor: ${grupo.transacciones[0].proveedor || 'N/A'}<br>`;
            html += `Fecha: ${new Date(grupo.transacciones[0].fecha).toLocaleDateString()}<br>`;

            // Mostrar solo primeras 2 IDs de ejemplo
            html += 'Ejemplos de IDs duplicados: ';
            const maxIds = Math.min(2, grupo.transacciones.length);
            for (let j = 0; j < maxIds; j++) {
              html += grupo.transacciones[j].idTransaccion;
              if (j < maxIds - 1) html += ', ';
            }
            if (grupo.transacciones.length > 2) {
              html += ` ... y ${grupo.transacciones.length - 2} más`;
            }
            html += '</li>';
          }
          html += '</ul>';

          if (resultado.entradasDuplicadas.length > 5) {
            html += `<p><em>... y ${resultado.entradasDuplicadas.length - 5} grupos más no mostrados</em></p>`;
          }
        }

        // Mostrar resumen de salidas duplicadas
        if (resultado.salidasDuplicadas.length > 0) {
          html += '<br><h5>📤 Resumen de Salidas Duplicadas:</h5>';
          html += `<p><strong>Total de grupos duplicados:</strong> ${resultado.salidasDuplicadas.length}</p>`;

          // Mostrar solo los primeros 5 grupos como ejemplo
          html += '<p><strong>Primeros grupos (muestra máximo 5):</strong></p><ul>';
          const maxGrupos = Math.min(5, resultado.salidasDuplicadas.length);

          for (let i = 0; i < maxGrupos; i++) {
            const grupo = resultado.salidasDuplicadas[i];
            html += `<li><strong>Grupo ${i + 1}:</strong> ${grupo.cantidad} transacciones duplicadas<br>`;
            html += `Entregado a: ${grupo.transacciones[0].aQuienEntrega || 'N/A'}<br>`;
            html += `Bote: ${grupo.transacciones[0].bote || 'N/A'}<br>`;
            html += `Fecha: ${new Date(grupo.transacciones[0].fecha).toLocaleDateString()}<br>`;

            // Mostrar solo primeras 2 IDs de ejemplo
            html += 'Ejemplos de IDs duplicados: ';
            const maxIds = Math.min(2, grupo.transacciones.length);
            for (let j = 0; j < maxIds; j++) {
              html += grupo.transacciones[j].idTransaccion;
              if (j < maxIds - 1) html += ', ';
            }
            if (grupo.transacciones.length > 2) {
              html += ` ... y ${grupo.transacciones.length - 2} más`;
            }
            html += '</li>';
          }
          html += '</ul>';

          if (resultado.salidasDuplicadas.length > 5) {
            html += `<p><em>... y ${resultado.salidasDuplicadas.length - 5} grupos más no mostrados</em></p>`;
          }
        }

        if (resultado.totalEntradasDuplicadas === 0 && resultado.totalSalidasDuplicadas === 0) {
          html += '<br><p style="color: green; font-weight: bold;">✅ ¡No se encontraron duplicados! El sistema está limpio.</p>';
        } else {
          html += '<br><div class="alerta warning">';
          html += '<p><strong>⚠️ Acción Recomendada:</strong></p>';
          html += '<p>Se encontraron duplicados. Use el botón "ELIMINAR DUPLICADOS" abajo para:</p>';
          html += '<ol>';
          html += '<li>Mantener solo la primera transacción de cada grupo</li>';
          html += '<li>Eliminar todas las transacciones duplicadas</li>';
          html += '<li>Recalcular los stocks correctamente</li>';
          html += '</ol>';
          html += '</div>';
        }

        html += '</div>';
        container.innerHTML = html;
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${error.message}</div>`;
      })
      .detectarDuplicados();
  }

  /**
   * Elimina duplicados con confirmación
   */
  function eliminarDuplicadosConfirmado() {
    const confirmacion = confirm(
      '⚠️ ADVERTENCIA CRÍTICA ⚠️\n\n' +
      'Esta acción:\n' +
      '1. Eliminará PERMANENTEMENTE todas las transacciones duplicadas\n' +
      '2. Recalculará TODOS los stocks desde cero\n' +
      '3. NO SE PUEDE DESHACER\n\n' +
      '¿Está COMPLETAMENTE SEGURO de continuar?'
    );

    if (!confirmacion) {
      return;
    }

    const confirmacion2 = confirm(
      '⚠️ ÚLTIMA CONFIRMACIÓN ⚠️\n\n' +
      'Esta es su última oportunidad para cancelar.\n\n' +
      '¿Proceder con la eliminación de duplicados?'
    );

    if (!confirmacion2) {
      return;
    }

    const container = document.getElementById('resultadoEliminacionDuplicados');
    container.innerHTML = '<p class="text-center">🗑️ Eliminando duplicados...</p>';

    mostrarCargando('🗑️ Eliminando duplicados y recalculando stocks...\nEsto puede tomar varios minutos...\nNO CIERRE ESTA VENTANA');

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          ocultarCargando();
          container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${resultado.error}</div>`;
          return;
        }

        mostrarCargando('✅ Duplicados eliminados!\nActualizando sistema...');

        let html = '<div class="alerta success">';
        html += '<h4>✅ Proceso Completado</h4>';
        html += `<p><strong>Entradas eliminadas:</strong> ${resultado.entradasEliminadas}</p>`;
        html += `<p><strong>Salidas eliminadas:</strong> ${resultado.salidasEliminadas}</p>`;
        html += `<p><strong>Filas de detalle eliminadas:</strong> ${resultado.filasDetalleEliminadas}</p>`;
        html += `<p><strong>Productos con stocks recalculados:</strong> ${resultado.stocksRecalculados}</p>`;
        html += `<br><p style="color: green; font-weight: bold;">${resultado.mensaje}</p>`;
        html += '</div>';

        container.innerHTML = html;

        // Limpiar el resultado de detección
        document.getElementById('resultadoDeteccionDuplicados').innerHTML = '';

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        setTimeout(function() {
          ocultarCargando();
        }, 1500);
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${error.message}</div>`;
      })
      .eliminarDuplicados();
  }

  /**
   * Recalcula todos los stocks desde cero
   */
  function recalcularStocks() {
    const confirmacion = confirm(
      '⚠️ ADVERTENCIA ⚠️\n\n' +
      'Esta acción recalculará TODOS los stocks desde cero basándose en las transacciones.\n\n' +
      '¿Continuar?'
    );

    if (!confirmacion) {
      return;
    }

    const container = document.getElementById('resultadoRecalculo');
    container.innerHTML = '<p class="text-center">🔢 Recalculando stocks...</p>';

    mostrarCargando('🔢 Recalculando todos los stocks...\nPor favor espere...');

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado.error) {
          ocultarCargando();
          container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${resultado.error}</div>`;
          return;
        }

        mostrarCargando('✅ Stocks recalculados!\nActualizando interfaz...');

        let html = '<div class="alerta success">';
        html += '<h4>✅ Stocks Recalculados</h4>';
        html += `<p><strong>Productos actualizados:</strong> ${resultado.productosActualizados}</p>`;
        html += `<p style="color: green; font-weight: bold;">${resultado.mensaje}</p>`;
        html += '</div>';

        container.innerHTML = html;

        // Recargar datos
        cargarProductos();
        cargarDashboard();

        setTimeout(function() {
          ocultarCargando();
        }, 1000);
      })
      .withFailureHandler(function(error) {
        ocultarCargando();
        container.innerHTML = `<div class="alerta error"><strong>❌ Error:</strong> ${error.message}</div>`;
      })
      .recalcularTodosLosStocks();
  }
</script>
